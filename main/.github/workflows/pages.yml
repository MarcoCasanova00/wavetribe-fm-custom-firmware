name: build-and-pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        run: pip3 install Pillow mido
      - name: Use Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Build the web emulator
        run: ./tools/build_web.sh
      - name: Run the host tests
        run: |
          tests/run_host.sh tests/scripts/riptide-demo.txt >/dev/null 2>&1 || true
          ls -la build/host | head
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ../gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
